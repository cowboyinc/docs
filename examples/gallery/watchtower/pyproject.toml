[project]
name = "watchtower"
version = "0.0.0"
requires-python = ">=3.11"
# cowboy-sdk is loaded from a node checkout by conftest.py until 0.1.2 is on
# PyPI; see examples/_sdk_path.py.
dependencies = []

[dependency-groups]
# cbor2 + cryptography back the off-chain CIP-7 tools (tools/) and their tests.
dev = ["pytest==9.1.1", "cbor2>=5.6", "cryptography>=42"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = [".", "../.."]
